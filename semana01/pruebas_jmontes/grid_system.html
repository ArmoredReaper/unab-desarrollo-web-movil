<!DOCTYPE html>
<html>
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>

<body>
    <div class="container-fluid">
        <h1>Pruebas de diseño responsivo</h1>
        <div class="row">
            <div class="col" style="background-color:cadetblue">Navbar</div>
        </div>
        <div class="row">
            <div class="col-sm-12 col-md-10 col-md-offset-1">
                <div class="row">
                    <div class="col-sm-3" style="background-color: blanchedalmond; min-height: 50px;">Izquierda</div>
                    <div class="col-sm-6" style="background-color: darkgoldenrod; min-height: 50px;">Centro</div>
                    <div class="col-sm-3" style="background-color: blanchedalmond; min-height: 50px;">Derecha</div>
                </div>
                <div class="row">
                    <div class="col-xs-6 col-sm-4 col-md-3" style="background-color: green; min-height: 50px;">Tarjeta 1</div>
                    <div class="col-xs-6 col-sm-4 col-md-3" style="background-color: greenyellow; min-height: 50px;">Tarjeta 2</div>
                    <div class="col-xs-6 col-sm-4 col-md-3" style="background-color: green; min-height: 50px;">Tarjeta 3</div>
                    <div class="col-xs-6 col-sm-4 col-md-3" style="background-color: greenyellow; min-height: 50px;">Tarjeta 4</div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col" style="background-color: cadetblue;">Footer</div>
        </div>
    </div>
</body>
</html>
