<!DOCTYPE html>
<html lang="es">

<head>
    <title>Prueba Grid Bootstrap 3</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>

<body>

<div class="container-fluid">

    <!-- Header -->
    <div class="row">
        <div class="col-xs-12"
             style="background-color: lightblue; min-height: 60px;">
            Header
        </div>
    </div>

    <!-- Primera fila: 4 + 8 -->
    <div class="row">

        <div class="col-sm-4"
             style="background-color: lightgreen; min-height: 100px;">
            Menú
        </div>

        <div class="col-sm-8"
             style="background-color: lightyellow; min-height: 100px;">
            Contenido principal
        </div>

    </div>

    <!-- Segunda fila: 4 + 4 + 4 -->
    <div class="row">

        <div class="col-sm-4"
             style="background-color: lightgray; min-height: 80px;">
            Bloque 1
        </div>

        <div class="col-sm-4"
             style="background-color: lightcoral; min-height: 80px;">
            Bloque 2
        </div>

        <div class="col-sm-4"
             style="background-color: lightgray; min-height: 80px;">
            Bloque 3
        </div>
    </div>

    <!-- Tercera fila: 6 + 6 -->
    <div class="row">

        <div class="col-sm-6"
             style="background-color: lightskyblue; min-height: 80px;">
            Izquierda
        </div>

        <div class="col-sm-6"
             style="background-color: lightpink; min-height: 80px;">
            Derecha
        </div>
    </div>
    <!-- Footer -->
    <div class="row">
        <div class="col-xs-12"
             style="background-color: lightblue; min-height: 60px;">
            Footer
        </div>
    </div>
</div>
</body>
</html>
