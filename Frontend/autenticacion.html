<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pagina de Autentificacion</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md bg-white border-bottom py-2 px-3 px-md-4 mb-4">
        <div class="container-fluid">
            <a href="index.html" class="btn btn-outline-secondary fw-semibold">
                Inicio
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion" aria-controls="menuNavegacion" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end mt-2 mt-md-0" id="menuNavegacion">
                <div class="navbar-nav align-items-md-center gap-2 gap-md-3">
                    <a href="productos.html" class="nav-link text-secondary fw-semibold">Productos</a>
                    <a href="carrito.html" class="nav-link text-secondary fw-semibold">Carrito</a>
                    <a href="administracion.html" class="nav-link text-secondary fw-semibold">Administración</a>
                    <a href="autenticacion.html" class="btn btn-outline-secondary px-3 py-1">Ingresar</a>
                    <a href="crear_usuario.html" class="btn btn-dark px-3 py-1 text-white">Registro</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="container my-5">
        <h2 class="text-center fw-bold mb-5">Pagina de Autentificacion</h2>

        <!-- Formulario de login -->
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                
                <div class="border border-dark p-4 p-md-5 bg-white">
                    <h4 class="text-center fw-bold mb-4">Iniciar Sesion</h4>

                    <form action="#" method="POST">
                        <div class="mb-4">
                            <label for="correo" class="form-label fw-bold fs-5">Correo electronico</label>
                            <input 
                                type="email" 
                                class="form-control form-control-lg input-placeholder-gray" 
                                id="correo" 
                                name="correo" 
                                placeholder="Celda Vacia a espera de correo" 
                                required
                            >
                        </div>

                        <div class="mb-4">
                            <label for="contrasena" class="form-label fw-bold fs-5">Contraseña</label>
                            <input 
                                type="password" 
                                class="form-control form-control-lg input-placeholder-gray" 
                                id="contrasena" 
                                name="contrasena" 
                                placeholder="Celda Vacia a espera de contraseña" 
                                required
                            >
                        </div>

                        <div class="text-center my-4">
                            <button type="submit" class="btn btn-gray-custom fs-5 px-4 py-2">
                                Boton Ingresar
                            </button>
                        </div>

                        <div class="text-center mb-3">
                            <a href="#" class="text-decoration-none text-dark fw-bold fs-5">
                                ¿Olvidaste tu constraseña?
                            </a>
                        </div>

                        <div class="text-center">
                            <a href="crear_usuario.html" class="btn btn-gray-custom fs-5 px-4 py-2">
                                Crear Cuenta
                            </a>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
